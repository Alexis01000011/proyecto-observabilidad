# observabilidad-devops · docker-compose
# Proyecto Final — plataforma de observabilidad (Prometheus + Grafana + Alertmanager + exporters)
#
# Estado: núcleo de observabilidad cableado (M2). El código real de Django y la app de
# Tomcat, y el método de credencial del mysqld-exporter, se afinan en M3.
#
# Secretos: NO van aquí. Se interpolan desde un archivo `.env` (gitignored) creado en deploy
# a partir de `.env.example`. Sin `.env`, `docker compose config` avisa "variable not set"
# (warnings, no errores) para los servicios que las usan.
#
# Prerrequisitos de deploy:
#   1) `docker network create proxy`  (red externa compartida con Nginx Proxy Manager; ver red 'proxy').
#   2) `secrets/smtp_password` debe existir como ARCHIVO antes del `up` (placeholder en M2; real en M5).

name: observabilidad-devops

networks:
  monitoring:
    driver: bridge
    ipam:                                   # subnet fija: la restricción `Require ip 172.28.0.0/16` de Django /metrics depende de ella
      config:
        - subnet: 172.28.0.0/16
  proxy:                                    # red externa COMPARTIDA con Nginx Proxy Manager (/opt/npm)
    external: true                          # se crea a mano en el host: `docker network create proxy`
    name: proxy                             # mismo objeto de red en ambos compose (sin prefijo de proyecto)

volumes:
  prometheus_data:
  grafana_data:
  mariadb_data:
  wordpress_data:

services:
  # ===================== STACK DE OBSERVABILIDAD =====================

  prometheus:
    image: prom/prometheus:v2.53.0          # LTS
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle               # permite recargar config sin reiniciar
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"                # interno: solo localhost (acceso por túnel SSH)
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.13           # 11.1.13: corrige CVE-2024-9264 (inyección de comandos / LFI, crítica)
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_COOKIE_SECURE: "true"      # el origen externo es HTTPS (Cloudflare→NPM): cookie de sesión Secure
      GF_SECURITY_COOKIE_SAMESITE: lax        # login por formulario, sin OAuth (default explícito)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"                # admin por túnel SSH; NPM llega por la red 'proxy', no por este bind
    networks: [monitoring, proxy]            # 'proxy' permite que NPM resuelva 'grafana' por nombre

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/smtp_password:/etc/alertmanager/smtp_password:ro   # secreto, fuera del repo (placeholder en M2)
    ports:
      - "127.0.0.1:9093:9093"                # interno: solo localhost
    networks: [monitoring]

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    restart: unless-stopped
    command:                                  # patrón documentado para métricas reales del host (riesgo DOK-1)
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [monitoring]                    # se queda en bridge: target DNS 'node_exporter:9100' intacto y :9100 NO expuesto en el host
    # Métricas de RED del host (node_network_*) reflejan el contenedor en bridge; se evalúa network_mode:host al construir el dashboard de host (M6).

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true                          # Debian/cgroup v2: ruta confiable (riesgo DOK-2)
    command:
      - --docker_only=true                    # solo contenedores Docker: menos cardinalidad, evita races de arranque
      - --housekeeping_interval=10s           # el default 1s consume mucha CPU
      - --store_container_labels=false        # limita cardinalidad (name/image/id se conservan igual)
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw                   # socket de Docker: rw según docs oficiales
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro       # CLAVE en cgroup v2: evita crash 'mountpoint for cpu not found' y métricas vacías
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8081:8080"                 # interno
    networks: [monitoring]

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox_exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [monitoring]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0       # v0.14 soporta DATA_SOURCE_NAME (riesgo DOK-3)
    container_name: mysqld-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "exporter:${EXPORTER_DB_PASSWORD}@(mariadb:3306)/"
    networks: [monitoring]
    depends_on:
      mariadb:
        condition: service_healthy           # espera healthcheck: usuarios de app/exporter ya creados por el init

  # ===================== APLICACIONES MONITOREADAS =====================

  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME}                  # consumidas por ./mariadb/init/02_app_users.sh en el primer arranque
      DJANGO_DB_USER: ${DJANGO_DB_USER}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro   # crea djangodb + wordpress + usuarios (M0/M3)
    healthcheck:                                         # gate para depends_on de exporter/apps
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [monitoring]
    # 3306 NO se publica (solo red interna)

  django-apache:
    build: ./django                           # app real + django-prometheus en M3
    container_name: django-apache
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}                       # default False; activar solo para depurar
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}   # https://<dominio> del formulario (CSRF tras proxy)
      DJANGO_DB_NAME: ${DJANGO_DB_NAME}
      DJANGO_DB_USER: ${DJANGO_DB_USER}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD}
      DJANGO_DB_HOST: mariadb
    networks: [monitoring, proxy]             # 'proxy' permite que NPM resuelva 'django-apache' por nombre
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # 80 no se publica al host; NPM proxea por nombre de contenedor. /metrics restringido a 172.28.0.0/16 (apache-site.conf)

  tomcat:
    build: ./tomcat                           # tomcat oficial + sample app + JMX agent en M3
    container_name: tomcat
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [monitoring, proxy]             # 'proxy' permite que NPM resuelva 'tomcat' por nombre
    # 8080 (app) vía NPM; 9404 (JMX) solo interno para Prometheus

  wordpress:
    image: wordpress:6-php8.2-apache
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks: [monitoring, proxy]             # 'proxy' permite que NPM resuelva 'wordpress' por nombre
    depends_on:
      mariadb:
        condition: service_healthy
    # 80 no se publica; NPM proxea por nombre de contenedor
