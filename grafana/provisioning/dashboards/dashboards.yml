# Grafana — provider de dashboards (carga .json desde el volumen). M0.
# Los .json se añaden en M6.
apiVersion: 1
providers:
  - name: 'observabilidad'
    orgId: 1
    folder: 'Observabilidad'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      # false: todos los .json del directorio van a la carpeta 'folder' (Observabilidad).
      # Con true, los .json en la raíz caen en 'General' y se ignora 'folder'.
      foldersFromFilesStructure: false
