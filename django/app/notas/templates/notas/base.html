<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Notas{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1rem; }
    .nota { border: 1px solid #ddd; border-radius: 6px; padding: .75rem 1rem; margin-bottom: .75rem; }
    .nota h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .nota time { color: #777; font-size: .85rem; }
    form label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    form input, form textarea { width: 100%; padding: .5rem; box-sizing: border-box; }
    .btn { display: inline-block; margin-top: 1rem; padding: .5rem 1rem; background: #2563eb; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
    .msg { padding: .5rem .75rem; border-radius: 4px; margin-bottom: .5rem; }
    .msg.success { background: #dcfce7; color: #166534; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'notas:lista' %}">Notas</a>
    <a href="{% url 'notas:crear' %}">Nueva nota</a>
  </nav>
  {% if messages %}
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
