# VirtualHost de la app Django (mod_wsgi) en el puerto 80.
#
# El módulo WSGI se carga vía /etc/apache2/mods-available/wsgi.load, generado en
# el Dockerfile con `mod_wsgi-express module-config` (incluye LoadModule + WSGIPythonHome
# globales apuntando al Python de la imagen, /usr/local).

<VirtualHost *:80>
    ServerName django-apache

    # Un SOLO proceso (processes=1) para que las métricas de django-prometheus sean
    # consistentes: con varios procesos cada uno tendría su propio registro y
    # Prometheus vería contadores que "saltan" según el worker que atienda (riesgo APP-2).
    # python-home apunta al prefijo del Python de la imagen; python-path expone /app.
    WSGIDaemonProcess django python-home=/usr/local python-path=/app processes=1 threads=2
    WSGIProcessGroup django
    WSGIScriptAlias / /app/config/wsgi.py

    <Directory /app/config>
        Require all granted
    </Directory>

    # Archivos estáticos servidos por Apache desde el STATIC_ROOT (collectstatic).
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    # /metrics RESTRINGIDO a la red interna de monitoreo.
    # El integrador fija la subred 172.28.0.0/16 a la red 'monitoring': Prometheus
    # scrapea desde ahí (PERMITIDO). El tráfico público entra por NPM en la red 'proxy'
    # (otra subred) y queda DENEGADO (riesgos APP-1 / APP-3).
    <Location /metrics>
        Require ip 172.28.0.0/16
    </Location>

    # Logs a stdout/stderr para que `docker logs django-apache` funcione.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
