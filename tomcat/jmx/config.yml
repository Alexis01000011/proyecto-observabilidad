# JMX Exporter — configuración para Tomcat/JVM (M3).
# Formato CLÁSICO, compatible con jmx_prometheus_javaagent 0.20.0.
# El catch-all expone todas las MBeans (JVM + Catalina): jvm_*, java_lang_*, etc.
# Defaults de 0.20.0: lowercaseOutputName=false y lowercaseOutputLabelNames=false,
# por eso se ponen en true explícitamente.
startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: ".*"
