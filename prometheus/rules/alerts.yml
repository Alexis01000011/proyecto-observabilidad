# Reglas de alerta — A1..A8 (mínimo 8) + opcionales. Se afinan/validan en M5.
# Base del ENUNCIADO (host) + alertas por servicio.
groups:
  - name: host-alerts
    rules:
      - alert: HighCPUUsage          # A1 — CPU > 80% durante 5 min
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de CPU"
          description: "La instancia {{ $labels.instance }} tiene CPU > 80% durante más de 5 minutos."

      - alert: HighMemoryUsage       # A2 — RAM > 85% durante 5 min
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de memoria RAM"
          description: "La instancia {{ $labels.instance }} tiene memoria > 85%."

      - alert: DiskAlmostFull        # A3 — Disco > 90%
        expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disco casi lleno"
          description: "El filesystem {{ $labels.mountpoint }} en {{ $labels.instance }} supera el 90% de uso."

  - name: service-alerts
    rules:
      # A4 — target de infraestructura caído. Acotado a los jobs SIN alerta propia
      # (prometheus/node_exporter/cadvisor) + el job blackbox 'wordpress_http' (detecta
      # una caída del propio blackbox_exporter). Así NO se solapa con A5/A6/A7/A8 y se
      # evitan correos duplicados por una sola caída (riesgo ALR-2).
      - alert: TargetDown            # A4
        expr: up{job=~"prometheus|node_exporter|cadvisor|wordpress_http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio/target no disponible"
          description: "El target {{ $labels.job }} ({{ $labels.instance }}) no responde."

      - alert: MariaDBDown           # A5
        # mysqld-exporter sigue respondiendo el scrape (up=1) aunque la BD esté caída,
        # devolviendo mysql_up=0; por eso se cubren AMBOS casos: exporter caído (up==0)
        # o BD no disponible (mysql_up==0).
        expr: up{job="mariadb"} == 0 or mysql_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB caída"
          description: "MariaDB no disponible (el exporter no responde o mysql_up=0)."

      - alert: DjangoDown            # A6
        expr: up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Django sin responder"
          description: "El endpoint /metrics de Django no responde."

      - alert: TomcatDown            # A7
        expr: up{job="tomcat"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tomcat sin responder"
          description: "El target JMX de Tomcat (9404) no responde."

      - alert: WordPressDown         # A8
        expr: probe_success{job="wordpress_http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "WordPress sin responder"
          description: "La sonda HTTP a WordPress no devuelve 2xx."

  - name: optional-alerts
    rules:
      - alert: HighResponseLatency   # A9 (opcional) — latencia HTTP > 1s
        expr: probe_duration_seconds{job="wordpress_http"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia HTTP alta"
          description: "La sonda a {{ $labels.instance }} tarda más de 1s."
